name: Build dynamic profile
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['profile.json', 'scripts/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: profile-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Fetch GitHub data and rebuild README + cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md assets scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile from GitHub data'
            git push
          fi
