<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="250" viewBox="0 0 980 250" role="img"><title>Current contribution streak, longest streak in rolling year, and active contribution days</title><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#a67bff"/><stop offset=".5" stop-color="#ff82c7"/><stop offset="1" stop-color="#71e9ed"/></linearGradient><radialGradient id="glow"><stop stop-color="#533c8b" stop-opacity=".6"/><stop offset="1" stop-color="#0d0c20" stop-opacity="0"/></radialGradient></defs><style>@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}.float{animation:drift 6s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="0" y="0" width="980" height="250" rx="24" fill="#0d0c20" stroke="none"/><text x="30" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#dcff7b" font-weight="700">SHOWING UP, ONE DAY AT A TIME</text><rect x="30" y="64" width="294" height="132" rx="16" fill="#17152f" stroke="none"/><text x="50" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a6a0c5" font-weight="600">CURRENT STREAK</text><text x="50" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="47" fill="#ff82c7" font-weight="700">2</text><text x="130" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a6a0c5" font-weight="400">days</text><rect x="343" y="64" width="294" height="132" rx="16" fill="#17152f" stroke="none"/><text x="363" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a6a0c5" font-weight="600">LONGEST / ROLLING YEAR</text><text x="363" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="47" fill="#ab83ff" font-weight="700">2</text><text x="443" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a6a0c5" font-weight="400">days</text><rect x="656" y="64" width="294" height="132" rx="16" fill="#17152f" stroke="none"/><text x="676" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a6a0c5" font-weight="600">ACTIVE DAYS / ROLLING YEAR</text><text x="676" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="47" fill="#71e9ed" font-weight="700">18</text><text x="756" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a6a0c5" font-weight="400">days</text><text x="30" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#a6a0c5" font-weight="400">Consecutive contribution days in GitHub’s calendar; current streak allows an unfinished today.</text></svg>