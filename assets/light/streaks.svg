<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Contribution streaks and weekday rhythm"><title>Contribution streaks and weekday rhythm</title><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.blink{animation:blink 1.1s steps(1) infinite}.rise{animation:rise .7s ease-out both}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="899.0" height="209" rx="14" fill="#FFFFFF" stroke="#E3DFD5" /><text x="28" y="34" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#B86E00" text-anchor="start" letter-spacing="1.5">STREAKS &amp; RHYTHM</text><text x="872" y="34" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#5D6773" text-anchor="end" >from the contribution calendar</text><rect x="28" y="52" width="160.0" height="130" rx="10" fill="#F6F5F1" stroke="#E3DFD5" /><text x="108" y="104" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="750" fill="#B86E00" text-anchor="middle" >4</text><text x="108" y="128" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1D2329" text-anchor="middle" >Current streak (days)</text><text x="108" y="160" font-family="'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#5D6773" text-anchor="middle" >Nov 11 – Nov 14</text><rect x="200" y="52" width="160.0" height="130" rx="10" fill="#F6F5F1" stroke="#E3DFD5" /><text x="280" y="104" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="750" fill="#0E8A63" text-anchor="middle" >8</text><text x="280" y="128" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1D2329" text-anch